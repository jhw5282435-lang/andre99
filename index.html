<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>안드레99 — 주식 리서치 대시보드</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;500;600;700&family=Noto+Sans+KR:wght@300;400;500;600;700&family=EB+Garamond:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    background: #f0f0f0;
    font-family: 'Noto Sans KR', sans-serif;
    color: #1a1a1a;
    min-height: 100vh;
  }
  .global-header {
    background: #002B5C;
    color: #fff;
    padding: 14px 18px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .global-header .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1200px;
    margin: 0 auto;
    flex-wrap: wrap;
    gap: 10px;
  }
  .global-header .brand { font-family: 'EB Garamond', serif; font-size: 20px; font-weight: 700; }
  .global-header .brand .ver { font-size: 11px; color: #B8941F; margin-left: 6px; letter-spacing: 0.1em; }
  .global-header .meta { font-size: 10px; color: rgba(255,255,255,0.7); letter-spacing: 0.1em; }
  .global-header .meta .live { color: #ff6b3d; }
  .global-header .meta .live::before { content: '●'; margin-right: 4px; animation: pulse 2s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  .ticker-bar { background: #fff; border-bottom: 2px solid #002B5C; }
  .ticker-bar .row { max-width: 1200px; margin: 0 auto; padding: 10px 14px; }
  .ticker-input-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .ticker-input {
    flex: 1; padding: 10px 14px;
    font-family: 'EB Garamond', serif; font-size: 14px; font-weight: 600;
    border: 1px solid #ddd; background: #FAFBFC; color: #002B5C;
    text-transform: uppercase; letter-spacing: 0.1em;
  }
  .ticker-input:focus { outline: none; border-color: #002B5C; background: #fff; }
  .ticker-btn {
    padding: 10px 18px; font-family: 'Noto Serif KR', serif; font-size: 12px;
    font-weight: 600; background: #002B5C; color: #fff; border: none; cursor: pointer;
  }
  .ticker-btn:hover { background: #001f43; }
  .ticker-tabs-row { display: flex; gap: 4px; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .ticker-tab {
    padding: 6px 12px; cursor: pointer; border: 1px solid transparent;
    text-align: center; min-width: 70px; background: #FAFBFC; flex-shrink: 0;
  }
  .ticker-tab:hover { background: #fff; border-color: #ddd; }
  .ticker-tab.active { background: #002B5C; color: #fff; }
  .ticker-tab .tk { font-family: 'EB Garamond', serif; font-size: 13px; font-weight: 700; }
  .ticker-tab .px { font-size: 9px; color: #555; margin-top: 2px; }
  .ticker-tab.active .px { color: rgba(255,255,255,0.8); }
  .ticker-tab .px.up { color: #1B365D; }
  .ticker-tab .px.down { color: #C0392B; }
  .ticker-tab.active .px.up, .ticker-tab.active .px.down { color: #fff; }

  .content { max-width: 1200px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
  @media (min-width: 768px) {
    .content { grid-template-columns: 1fr 1fr; padding: 20px; gap: 20px; }
    .card.full { grid-column: 1 / -1; }
  }

  .card {
    background: #fff;
    border-top: 3px solid #002B5C;
    border-bottom: 1px solid #ddd;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .card-head {
    padding: 12px 16px 10px; border-bottom: 1px solid #ddd;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .card-head .ttl { font-family: 'Noto Serif KR', serif; font-size: 14px; color: #002B5C; font-weight: 700; }
  .card-head .meta { font-size: 9px; color: #888; letter-spacing: 0.05em; }
  .card-body { padding: 14px 16px; }

  .stock-head {
    display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: end;
    padding-bottom: 10px; border-bottom: 1px solid #ddd; margin-bottom: 14px;
  }
  .stock-head .ticker { font-family: 'EB Garamond', serif; font-size: 28px; font-weight: 700; color: #002B5C; line-height: 1; }
  .stock-head .name { font-size: 11px; color: #555; margin-top: 4px; }
  .stock-head .price-area { text-align: right; }
  .stock-head .price { font-family: 'EB Garamond', serif; font-size: 24px; font-weight: 700; color: #000; line-height: 1; }
  .stock-head .chg { font-size: 11px; margin-top: 3px; font-weight: 700; }
  .stock-head .chg.up { color: #1B365D; }
  .stock-head .chg.down { color: #C0392B; }

  /* 시나리오 토글 */
  .horizon-toggle {
    display: flex; gap: 0; margin-bottom: 10px; border: 1px solid #002B5C;
  }
  .horizon-toggle button {
    flex: 1; padding: 8px; background: #fff; border: none; cursor: pointer;
    font-family: 'Noto Serif KR', serif; font-size: 11px; color: #002B5C; font-weight: 600;
  }
  .horizon-toggle button.active { background: #002B5C; color: #fff; }

  .scenario-section {
    background: #FAFBFC; border: 1px solid #002B5C;
    padding: 14px; margin-bottom: 14px;
  }
  .scenario-section .lbl {
    font-family: 'Noto Serif KR', serif; font-size: 11px;
    color: #002B5C; font-weight: 700; margin-bottom: 10px; letter-spacing: 0.05em;
  }
  .scenario-section .lbl::before { content: '★ '; color: #B8941F; }
  .scenario-row {
    display: grid; grid-template-columns: 50px 40px 1fr 60px; gap: 8px;
    align-items: center; padding: 7px 0; border-bottom: 1px dashed #ddd; font-size: 11px;
  }
  .scenario-row:last-child { border-bottom: none; }
  .scenario-row .name { font-family: 'Noto Serif KR', serif; font-weight: 700; }
  .scenario-row .name.bear { color: #C0392B; }
  .scenario-row .name.cons { color: #002B5C; }
  .scenario-row .name.bull { color: #1B365D; }
  .scenario-row .prob { font-family: 'Courier New', monospace; text-align: right; color: #555; font-size: 10px; }
  .scenario-row .bar-wrap { height: 16px; background: #fff; border: 1px solid #ddd; position: relative; overflow: hidden; }
  .scenario-row .bar { height: 100%; position: absolute; top: 0; left: 0; }
  .scenario-row .bar.bear { background: #C0392B; }
  .scenario-row .bar.cons { background: #002B5C; }
  .scenario-row .bar.bull { background: #1B365D; }
  .scenario-row .price { text-align: right; font-family: 'EB Garamond', serif; font-weight: 700; color: #000; font-size: 12px; }

  .trigger-list { margin-top: 10px; padding: 8px 10px; background: #fff; border: 1px dashed #ddd; }
  .trigger-list .ttl { font-family: 'Noto Serif KR', serif; font-size: 9px; color: #555; font-weight: 700; margin-bottom: 5px; letter-spacing: 0.05em; }
  .trigger-list .item { font-size: 10px; color: #4a4a4a; line-height: 1.5; padding: 2px 0; }
  .trigger-list .item b { color: #002B5C; font-family: 'Noto Serif KR', serif; }

  .scenario-summary { background: #002B5C; color: #fff; padding: 10px 12px; margin-top: 10px; text-align: center; }
  .scenario-summary .l { font-size: 9px; letter-spacing: 0.1em; margin-bottom: 4px; color: rgba(255,255,255,0.7); }
  .scenario-summary .v { font-family: 'EB Garamond', serif; font-size: 22px; font-weight: 700; }
  .scenario-summary .sub { font-size: 10px; margin-top: 4px; color: #B8941F; }

  /* Risk-Reward 카드 */
  .rr-card { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1px; background: #ddd; border: 1px solid #ddd; margin-bottom: 14px; }
  .rr-card .cell { background: #fff; padding: 12px 10px; text-align: center; }
  .rr-card .cell .k { font-size: 9px; color: #555; font-weight: 600; margin-bottom: 4px; letter-spacing: 0.05em; }
  .rr-card .cell .v { font-family: 'EB Garamond', serif; font-size: 18px; font-weight: 700; line-height: 1; }
  .rr-card .cell .v.bear { color: #C0392B; }
  .rr-card .cell .v.good { color: #1B365D; }
  .rr-card .cell .sub { font-size: 8px; color: #888; margin-top: 3px; }

  /* 컨센서스 비교 */
  .consensus-card {
    background: #FFFBF0; border: 1px solid #E8DBA0; border-left: 3px solid #B8941F;
    padding: 10px 12px; margin-bottom: 14px;
  }
  .consensus-card .ttl { font-family: 'Noto Serif KR', serif; font-size: 10px; color: #8B6F0E; font-weight: 700; margin-bottom: 8px; padding-bottom: 4px; border-bottom: 1px dotted #E8DBA0; }
  .consensus-card .ttl::before { content: '⚖ '; }
  .consensus-card .row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 11px; }
  .consensus-card .row .label { color: #555; }
  .consensus-card .row .value { font-family: 'EB Garamond', serif; font-weight: 700; color: #1a1a1a; }
  .consensus-card .diff { margin-top: 6px; padding-top: 6px; border-top: 1px dotted #E8DBA0; font-size: 10px; text-align: center; color: #8B6F0E; font-weight: 600; }

  .ind-matrix { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: #ddd; border: 1px solid #ddd; }
  .ind-matrix .cell { background: #fff; padding: 9px 10px; }
  .ind-matrix .cell .k { font-size: 9px; color: #555; font-weight: 600; margin-bottom: 3px; }
  .ind-matrix .cell .v { font-family: 'EB Garamond', serif; font-size: 15px; font-weight: 700; line-height: 1; }
  .ind-matrix .cell .v.bear { color: #C0392B; }
  .ind-matrix .cell .v.good { color: #1B365D; }
  .ind-matrix .cell .sub { font-size: 8px; color: #888; margin-top: 2px; }

  table.dt { width: 100%; border-collapse: collapse; }
  table.dt th { text-align: left; padding: 6px; background: #F5F5F5; border-bottom: 1px solid #002B5C; font-size: 9px; color: #555; font-weight: 600; }
  table.dt th:not(:first-child) { text-align: right; }
  table.dt td { padding: 6px; border-bottom: 1px solid #eee; font-size: 11px; }
  table.dt td:not(:first-child) { text-align: right; font-family: 'Courier New', monospace; font-weight: 700; }
  table.dt td.bear { color: #C0392B; }
  table.dt td.good { color: #1B365D; }
  table.dt tr.fv-row td { background: #F8F9FB; font-weight: 700; color: #002B5C; border-bottom: 2px solid #002B5C; }

  .peer-row { display: grid; grid-template-columns: 60px 1fr 50px; gap: 6px; align-items: center; padding: 5px 0; font-size: 10px; }
  .peer-row .tk { font-family: 'EB Garamond', serif; font-weight: 700; }
  .peer-row .tk.target { color: #002B5C; }
  .peer-row .gap-bar { height: 12px; background: #FAFBFC; border: 1px solid #ddd; position: relative; overflow: hidden; }
  .peer-row .gap-bar .center { position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: #999; }
  .peer-row .gap-bar .fill { position: absolute; top: 1px; bottom: 1px; right: 50%; background: #C0392B; }
  .peer-row .gap-bar .fill.warn { background: #B8741F; }
  .peer-row .gap-bar .fill.good { left: 50%; right: auto; background: #1B365D; }
  .peer-row .gap { text-align: right; font-weight: 700; font-family: 'Courier New', monospace; }
  .peer-row .gap.bear { color: #C0392B; }
  .peer-row .gap.warn { color: #B8741F; }
  .peer-row .gap.good { color: #1B365D; }
  .peer-section + .peer-section { margin-top: 12px; }
  .peer-section .ttl { font-family: 'Noto Serif KR', serif; font-size: 11px; font-weight: 700; margin-bottom: 4px; padding-bottom: 3px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; }
  .peer-section .ttl.saas { color: #C0392B; }
  .peer-section .ttl.sec { color: #1B365D; }
  .peer-section .ttl .meta { font-size: 9px; color: #555; font-weight: 400; }

  .cfm-section .tv-chart-wrap {
    width: 100%;
    height: 360px;
    border: 1px solid #ddd;
    border-bottom: none;
    overflow: hidden;
    position: relative;
    background: #FAFBFC;
  }
  .cfm-section .tv-iframe {
    width: 100%;
    height: 100%;
    border: 0;
    display: block;
  }
  .cfm-section .tv-caption {
    background: #FAFBFC;
    border: 1px solid #ddd;
    border-top: none;
    padding: 6px 10px;
    font-size: 10px;
    color: #555;
    line-height: 1.4;
  }
  .cfm-section .tv-caption b {
    color: #002B5C;
    font-family: 'EB Garamond', serif;
    font-weight: 700;
  }
  @media (min-width: 768px) {
    .cfm-section .tv-chart-wrap { height: 400px; }
  }
  .cfm-modules { margin-top: 12px; }
  .cfm-mini { background: #FAFBFC; border: 1px solid #ddd; padding: 8px 10px; margin-bottom: 6px; }
  .cfm-mini .head { display: flex; justify-content: space-between; margin-bottom: 4px; }
  .cfm-mini .name { font-family: 'Noto Serif KR', serif; font-size: 10px; color: #002B5C; font-weight: 700; }
  .cfm-mini .score { font-family: 'EB Garamond', serif; font-size: 13px; font-weight: 700; }
  .cfm-mini .score.bear { color: #C0392B; }
  .cfm-mini .score.warn { color: #B8741F; }
  .cfm-mini .score.neu { color: #4a4a4a; }
  .cfm-mini .score.good { color: #1B365D; }
  .cfm-mini .desc { font-size: 10px; color: #4a4a4a; line-height: 1.4; }
  .cfm-mini .desc b { color: #002B5C; font-family: 'EB Garamond', serif; }
  .cfm-total { background: #002B5C; color: #fff; text-align: center; padding: 10px; margin-top: 8px; }
  .cfm-total .l { font-size: 9px; letter-spacing: 0.1em; color: rgba(255,255,255,0.7); }
  .cfm-total .v { font-family: 'EB Garamond', serif; font-size: 20px; font-weight: 700; margin-top: 2px; }

  .verdict { background: #FAFBFC; border-left: 4px solid #002B5C; padding: 14px 16px; }
  .verdict .l { font-family: 'Noto Serif KR', serif; font-size: 10px; color: #002B5C; font-weight: 700; margin-bottom: 6px; }
  .verdict .h { font-family: 'Noto Serif KR', serif; font-size: 15px; color: #1a1a1a; font-weight: 700; line-height: 1.4; margin-bottom: 8px; }
  .verdict .h em { font-style: normal; color: #002B5C; }
  .verdict .d { font-size: 11px; color: #4a4a4a; line-height: 1.6; }
  .verdict .d b { color: #002B5C; font-weight: 700; }

  .limit-box { background: #FFF8F0; border: 1px dashed #B8741F; padding: 10px 12px; margin-top: 10px; }
  .limit-box .l { font-family: 'Noto Serif KR', serif; font-size: 10px; color: #B8741F; font-weight: 700; margin-bottom: 5px; }
  .limit-box .l::before { content: '⚠ '; }
  .limit-box .d { font-size: 10px; color: #4a4a4a; line-height: 1.5; }

  .empty-state { background: #fff; border: 1px dashed #ddd; padding: 40px 20px; text-align: center; grid-column: 1 / -1; }
  .empty-state .icon { font-family: 'EB Garamond', serif; font-size: 40px; color: #002B5C; margin-bottom: 12px; }
  .empty-state .title { font-family: 'Noto Serif KR', serif; font-size: 16px; color: #1a1a1a; font-weight: 700; margin-bottom: 8px; }
  .empty-state .desc { font-size: 12px; color: #555; line-height: 1.6; }
  .empty-state .desc code { background: #FFFBF0; border: 1px solid #E8DBA0; padding: 2px 6px; color: #8B6F0E; font-family: 'Courier New', monospace; font-size: 11px; }

  .footer { background: #002B5C; color: #fff; padding: 14px 18px; margin-top: 20px; text-align: center; font-size: 10px; letter-spacing: 0.1em; line-height: 1.6; }
  .footer .ver { color: #B8941F; font-weight: 700; }
  .footer .small { font-size: 9px; color: rgba(255,255,255,0.6); margin-top: 4px; }

  .fade-in { animation: fadeIn 0.3s ease-in; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="global-header">
  <div class="row">
    <div class="brand">ANDRE99 <span class="ver">v1.2 (월街 방법론)</span></div>
    <div class="meta"><span class="live" id="lastUpdate">LIVE</span></div>
  </div>
</div>

<div class="ticker-bar">
  <div class="row">
    <div class="ticker-input-row">
      <input type="text" id="tickerInput" class="ticker-input" placeholder="종목 입력 (예: PLTR)" maxlength="6">
      <button class="ticker-btn" onclick="searchTicker()">분석</button>
    </div>
    <div class="ticker-tabs-row" id="tabRow"></div>
  </div>
</div>

<div class="content" id="content"></div>

<div class="footer">
  ANDRE99 <span class="ver">v1.2</span> · MORGAN STANLEY RISK-REWARD + GOLDMAN BULL/BEAR FRAMEWORK
  <div class="small">투자자문 아님 · 교육 콘텐츠 · DYOR · @andre99</div>
</div>

<script>
let DATA = null;
let activeTicker = 'PLTR';
let horizon = '12m';

async function loadData() {
  try {
    const res = await fetch('data.json');
    DATA = await res.json();
    document.getElementById('lastUpdate').textContent = 'LIVE ' + DATA._meta.last_updated;
    renderTabs();
    renderContent();
  } catch (e) {
    document.getElementById('content').innerHTML = `
      <div class="empty-state">
        <div class="icon">⚠</div>
        <div class="title">data.json 로딩 실패</div>
        <div class="desc">파일을 같은 폴더에 두었는지 확인해주세요.</div>
      </div>
    `;
  }
}

function renderTabs() {
  const tickers = Object.keys(DATA.stocks);
  const row = document.getElementById('tabRow');
  row.innerHTML = tickers.map(tk => {
    const s = DATA.stocks[tk];
    const cls = s.chg_day >= 0 ? 'up' : 'down';
    const sign = s.chg_day >= 0 ? '+' : '';
    return `
      <div class="ticker-tab ${tk === activeTicker ? 'active' : ''}" onclick="switchTicker('${tk}')">
        <div class="tk">${tk}</div>
        <div class="px ${cls}">$${s.price} ${sign}${s.chg_day}%</div>
      </div>
    `;
  }).join('');
}

function searchTicker() {
  const input = document.getElementById('tickerInput').value.toUpperCase().trim();
  if (!input) return;
  if (DATA.stocks[input]) switchTicker(input);
  else { activeTicker = input; renderTabs(); renderEmpty(input); }
  document.getElementById('tickerInput').value = '';
}

function switchTicker(tk) {
  activeTicker = tk;
  renderTabs();
  renderContent();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function setHorizon(h) { horizon = h; renderContent(); }

function renderEmpty(tk) {
  document.getElementById('content').innerHTML = `
    <div class="empty-state">
      <div class="icon">${tk}</div>
      <div class="title">아직 분석되지 않은 종목입니다</div>
      <div class="desc">Claude에게: <code>안드레99 ${tk} 갱신</code></div>
    </div>
  `;
}

function renderContent() {
  const s = DATA.stocks[activeTicker];
  if (!s) { renderEmpty(activeTicker); return; }
  const c = document.getElementById('content');
  
  const scenarios = horizon === '12m' ? s.scenarios_12m : s.scenarios_5y;
  const expected = horizon === '12m' ? s.expected_12m : s.expected_5y;
  const maxFv = Math.max(...scenarios.map(x => x.fv));
  const saasAvg = (s.peers.saas.reduce((a,b)=>a+b.gap,0)/s.peers.saas.length).toFixed(1);
  const secAvg = (s.peers.sec.reduce((a,b)=>a+b.gap,0)/s.peers.sec.length).toFixed(1);
  const consGap = ((expected/s.consensus_pt - 1)*100).toFixed(1);
  const rrClass = s.risk_reward.ratio >= 2 ? 'good' : (s.risk_reward.ratio >= 1.5 ? '' : 'bear');

  c.innerHTML = `
    <!-- 메인: 시나리오 -->
    <div class="card full fade-in">
      <div class="card-head">
        <span class="ttl">${activeTicker} · Risk-Reward Framework (Morgan Stanley 방식)</span>
        <span class="meta">${DATA._meta.last_updated}</span>
      </div>
      <div class="card-body">
        <div class="stock-head">
          <div>
            <div class="ticker">${activeTicker}</div>
            <div class="name">${s.name} · ${s.sector}</div>
          </div>
          <div class="price-area">
            <div class="price">$${s.price}</div>
            <div class="chg ${s.chg_day >= 0 ? 'up' : 'down'}">
              ${s.chg_day >= 0 ? '▲' : '▼'} ${Math.abs(s.chg_day)}% (당일) / ${s.chg_52w}% (52주)
            </div>
          </div>
        </div>

        <!-- Risk-Reward 카드 -->
        <div class="rr-card">
          <div class="cell">
            <div class="k">Bull Upside</div>
            <div class="v good">+${s.risk_reward.bull_upside.toFixed(0)}%</div>
            <div class="sub">12개월 상승 여력</div>
          </div>
          <div class="cell" style="background:#FAFBFC;">
            <div class="k">Risk-Reward Ratio</div>
            <div class="v ${rrClass}">${s.risk_reward.ratio.toFixed(2)}</div>
            <div class="sub">${s.risk_reward.verdict}</div>
          </div>
          <div class="cell">
            <div class="k">Bear Downside</div>
            <div class="v bear">${s.risk_reward.bear_downside.toFixed(0)}%</div>
            <div class="sub">12개월 하락 위험</div>
          </div>
        </div>

        <!-- 컨센서스 비교 -->
        <div class="consensus-card">
          <div class="ttl">월街 컨센서스 vs 안드레99</div>
          <div class="row"><span class="label">월街 평균 PT (12개월)</span><span class="value">$${s.consensus_pt}</span></div>
          <div class="row"><span class="label">안드레99 12M Base</span><span class="value">$${s.scenarios_12m[1].fv}</span></div>
          <div class="row"><span class="label">안드레99 12M 기댓값</span><span class="value">$${s.expected_12m}</span></div>
          <div class="diff">기댓값 vs 월街 PT 차이: ${consGap >= 0 ? '+' : ''}${consGap}%</div>
        </div>

        <!-- 시나리오 horizon 토글 -->
        <div class="horizon-toggle">
          <button class="${horizon === '12m' ? 'active' : ''}" onclick="setHorizon('12m')">12개월 (Morgan Stanley 표준)</button>
          <button class="${horizon === '5y' ? 'active' : ''}" onclick="setHorizon('5y')">5년 (장기 시나리오)</button>
        </div>
        
        <div class="scenario-section">
          <div class="lbl">3-시나리오 (Bull / Base / Bear)</div>
          ${scenarios.map(sc => {
            const w = (sc.fv / maxFv) * 100;
            return `
              <div class="scenario-row">
                <span class="name ${sc.cls}">${sc.name}</span>
                <span class="prob">${sc.prob}%</span>
                <span class="bar-wrap"><span class="bar ${sc.cls}" style="width:${w}%"></span></span>
                <span class="price">$${sc.fv}</span>
              </div>
            `;
          }).join('')}
          
          <div class="trigger-list">
            <div class="ttl">시나리오별 트리거 (Goldman Sachs 방식 · specific triggers)</div>
            ${scenarios.map(sc => `<div class="item"><b>${sc.name}:</b> ${sc.trigger}</div>`).join('')}
          </div>

          <div class="scenario-summary">
            <div class="l">${horizon === '12m' ? '12개월' : '5년'} 확률 가중 기댓값</div>
            <div class="v">$${expected}</div>
            <div class="sub">현재가 $${s.price} 대비 ${((expected/s.price - 1)*100).toFixed(1)}%</div>
          </div>
        </div>
      </div>
    </div>
    
    <!-- 6 지표 -->
    <div class="card fade-in">
      <div class="card-head"><span class="ttl">표 · 핵심 지표 6개</span><span class="meta">실측</span></div>
      <div class="card-body">
        <div class="ind-matrix">
          ${s.indicators.map(i => `
            <div class="cell"><div class="k">${i.k}</div><div class="v ${i.cls}">${i.v}</div><div class="sub">${i.sub}</div></div>
          `).join('')}
        </div>
      </div>
    </div>
    
    <!-- 5개 모델 -->
    <div class="card fade-in">
      <div class="card-head"><span class="ttl">정량 모델 (Bear 시나리오 input)</span><span class="meta">참고용</span></div>
      <div class="card-body">
        <table class="dt">
          <thead><tr><th>모델</th><th>가중치</th><th>적정가</th><th>괴리</th></tr></thead>
          <tbody>
            ${s.models.map(m => `
              <tr>
                <td>${m.name}${m.note ? `<br><span style="font-size:8px;color:#888;">${m.note}</span>` : ''}</td>
                <td>${m.weight}</td>
                <td class="${m.gap !== null && m.gap < -30 ? 'bear' : ''}">${m.fv !== null ? '$' + m.fv : 'N/A'}</td>
                <td class="${m.gap !== null && m.gap < -30 ? 'bear' : ''}">${m.gap !== null ? m.gap + '%' : 'EXTREME'}</td>
              </tr>
            `).join('')}
            <tr class="fv-row">
              <td>정량 평균</td><td>—</td><td>$${s.fv_avg}</td>
              <td>${((s.fv_avg/s.price - 1)*100).toFixed(1)}%</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
    
    <!-- 피어 -->
    <div class="card fade-in">
      <div class="card-head"><span class="ttl">PCM · 피어 비교</span><span class="meta">11종</span></div>
      <div class="card-body">
        <div class="peer-section">
          <div class="ttl saas"><span>① 동일 섹터 5종</span><span class="meta">평균 ${saasAvg}%</span></div>
          ${s.peers.saas.map(p => {
            const w = Math.min(Math.abs(p.gap), 50);
            return `
              <div class="peer-row">
                <span class="tk ${p.tk === activeTicker ? 'target' : ''}">${p.tk}</span>
                <span class="gap-bar"><span class="center"></span><span class="fill ${p.cls === 'good' ? 'good' : p.cls === 'warn' ? 'warn' : ''}" style="width:${w}%"></span></span>
                <span class="gap ${p.cls}">${p.gap}%</span>
              </div>
            `;
          }).join('')}
        </div>
        <div class="peer-section">
          <div class="ttl sec"><span>② 다섹터 검증 5종</span><span class="meta">평균 ${secAvg}%</span></div>
          ${s.peers.sec.map(p => {
            const w = Math.min(Math.abs(p.gap), 50);
            return `
              <div class="peer-row">
                <span class="tk">${p.tk}</span>
                <span class="gap-bar"><span class="center"></span><span class="fill ${p.cls === 'good' ? 'good' : p.cls === 'warn' ? 'warn' : ''}" style="width:${w}%"></span></span>
                <span class="gap ${p.cls}">${p.gap}%</span>
              </div>
            `;
          }).join('')}
        </div>
      </div>
    </div>
    
    <!-- CFM -->
    <div class="card fade-in">
      <div class="card-head"><span class="ttl">CFM · 차트 분석</span><span class="meta">3-모듈</span></div>
      <div class="card-body cfm-section">
        <div class="tv-chart-wrap">
          <iframe
            src="https://s.tradingview.com/widgetembed/?symbol=NASDAQ%3A${activeTicker}&interval=D&hidesidetoolbar=1&hidetoptoolbar=0&symboledit=1&saveimage=0&toolbarbg=F1F3F6&studies=%5B%22MASimple%40tv-basicstudies%22%5D&theme=light&style=2&timezone=Asia%2FSeoul&studies_overrides=%7B%7D&overrides=%7B%7D&enabled_features=%5B%5D&disabled_features=%5B%22header_compare%22%5D&locale=kr"
            class="tv-iframe"
            frameborder="0"
            allowfullscreen
            allowtransparency="true"
            scrolling="no">
          </iframe>
        </div>
        <div class="tv-caption">
          ▸ <b>${activeTicker}</b> 실시간 차트 (TradingView) · 일봉 + 이동평균선
        </div>
        <div class="cfm-modules">
          ${s.cfm.modules.map(m => `
            <div class="cfm-mini">
              <div class="head">
                <span class="name">▣ ${m.name} (w ${m.weight})</span>
                <span class="score ${m.cls}">${m.score >= 0 ? '+' : ''}${m.score}</span>
              </div>
              <div class="desc">${m.desc}</div>
            </div>
          `).join('')}
        </div>
        <div class="cfm-total">
          <div class="l">CFM 통합 점수</div>
          <div class="v">${s.cfm.total >= 0 ? '+' : ''}${s.cfm.total}</div>
        </div>
      </div>
    </div>
    
    <!-- VERDICT -->
    <div class="card full fade-in">
      <div class="card-head"><span class="ttl">VERDICT · 통합 결론</span><span class="meta">v1.2 월街 방법론</span></div>
      <div class="card-body">
        <div class="verdict">
          <div class="l">▸ 통합 결론 (Risk-Reward + 컨센서스 + CFM)</div>
          <div class="h">${s.verdict.h}</div>
          <div class="d">${s.verdict.d}</div>
        </div>
        <div class="limit-box">
          <div class="l">모델 한계 (v1.2 시점)</div>
          <div class="d">
            <b>1.</b> 시나리오 확률 = 수동 배정 (v1.3에서 옵션 IV 자동화 예정)<br>
            <b>2.</b> 12개월 타겟은 Morgan Stanley 표준, 5년은 보조<br>
            <b>3.</b> Risk-Reward Ratio: 2+ 매우 매력적 / 1.5+ 매력적 / 1+ 균형 / 1- 위험<br>
            <b>4.</b> 백테스트 미실시 (v0.7 누적 후 검증)
          </div>
        </div>
      </div>
    </div>
  `;
}

loadData();
document.getElementById('tickerInput').addEventListener('keypress', e => {
  if (e.key === 'Enter') searchTicker();
});
</script>

</body>
</html>
