# 안드레99 사업별 매출 시험 — SEC 월간 자료에서 애플 · 엔비디아 · 팔란티어 사업별 매출을 뽑아 합계 검증
# 연락처는 저장소 비밀값 SEC_UA 에서만 읽어요(코드 · 기록에 안 나옴). 앱 파일은 건드리지 않아요.
# 결과: 이 실행 화면의 Summary + 「seg-test-out」 가지(main 과 분리)
name: sec-segments-test
on:
  push:
    branches: [main, 'claude/**']
    paths: ['.github/workflows/sec-segments-test.yml', 'tools/sec_segments.py']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: 비밀값 확인
        id: chk
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: |
          if [ -z "$SEC_UA" ]; then echo "SEC_UA 비밀값이 아직 없어요 — 넣은 뒤 이 실행을 Re-run 하세요"; echo "ok=false" >> "$GITHUB_OUTPUT"; else echo "ok=true" >> "$GITHUB_OUTPUT"; fi
      - name: 사업별 매출 뽑기 · 합계 검증
        if: steps.chk.outputs.ok == 'true'
        env:
          SEC_UA: ${{ secrets.SEC_UA }}
        run: python3 tools/sec_segments.py --months 2025_10,2025_11,2026_02,2026_10 --tickers AAPL:320193,NVDA:1045810,PLTR:1321655 --out seg_out
      - name: 결과 요약 화면
        if: steps.chk.outputs.ok == 'true'
        run: |
          { echo '## 사업별 매출 시험 결과'; echo '```'; cat seg_out/summary.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: 결과를 seg-test-out 가지에 올리기 (main 은 그대로)
        if: steps.chk.outputs.ok == 'true'
        run: |
          cp -r seg_out /tmp/seg_out
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout --orphan seg-test-out
          git rm -rf -q .
          rm -rf seg_out
          cp -r /tmp/seg_out ./seg_out
          git add seg_out
          git commit -q -m "사업별 시험 결과 $(date -u +%F)"
          git push -f origin seg-test-out
      - name: 결과 파일 보관
        if: steps.chk.outputs.ok == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: seg_out
          path: seg_out
